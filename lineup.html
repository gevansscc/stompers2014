<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lineup Board</title>
<style>
  :root{
    --bg:#f4f5f2; --card:#fff; --ink:#1c2420; --muted:#66716b; --line:#dfe3dd;
    --grass1:#2f7d44; --grass2:#2a713e;
    --starter:#0f4c81; --sub1:#d9822b; --sub2:#7a4cc2; --empty:#8a948e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1d2220; --ink:#eef1ee; --muted:#9aa59f; --line:#2f3733; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:16px 16px 8px;max-width:1100px;margin:0 auto}
  h1{margin:0;font-size:1.35rem}
  .sub{color:var(--muted);font-size:.9rem}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .seg button{border:0;background:transparent;color:var(--ink);padding:8px 12px;font:inherit;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--starter);color:#fff}
  .seg button.s1[aria-pressed="true"]{background:var(--sub1)}
  .seg button.s2[aria-pressed="true"]{background:var(--sub2)}
  select,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font:inherit;cursor:pointer}
  label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:.9rem}
  main{max-width:1100px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:860px){ main{grid-template-columns:minmax(0,520px) minmax(0,1fr)} }
  .pitch{position:relative;width:100%;max-width:520px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;
    background:repeating-linear-gradient(180deg,var(--grass1) 0 8.33%,var(--grass2) 8.33% 16.66%);
    box-shadow:0 2px 10px rgba(0,0,0,.18);margin:0 auto}
  .pitch svg{position:absolute;inset:0;width:100%;height:100%}
  .pitch svg *{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.5;vector-effect:non-scaling-stroke}
  .pin{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:22%;pointer-events:none}
  .dot{width:clamp(30px,8vw,44px);aspect-ratio:1;border-radius:50%;background:var(--starter);color:#fff;border:2px solid #fff;
    display:grid;place-items:center;font-weight:700;font-size:clamp(.7rem,2.4vw,.95rem);box-shadow:0 2px 5px rgba(0,0,0,.35)}
  .pin.t1 .dot{background:var(--sub1)} .pin.t2 .dot{background:var(--sub2)}
  .pin.empty .dot{background:var(--empty);opacity:.8;border-style:dashed}
  .pin.fallback .dot{opacity:.55}
  .name{margin-top:3px;background:rgba(0,0,0,.62);color:#fff;border-radius:6px;padding:1px 6px;font-size:clamp(.65rem,2.2vw,.82rem);
    text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pos{font-size:.65rem;color:rgba(255,255,255,.85);text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.04em}
  .subs{font-size:.62rem;color:#fff;background:rgba(0,0,0,.45);border-radius:6px;padding:0 5px;margin-top:2px;text-align:center;line-height:1.35}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .panel h2{margin:0 0 8px;font-size:1rem}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
  .warn{color:#b3261e;font-size:.88rem;margin:6px 0 0}
  textarea{width:100%;min-height:300px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}
  .status{font-size:.82rem;color:var(--muted)}
  .drop{outline:3px dashed var(--sub1);outline-offset:-6px}
  @media print{ header .bar,.panel.editor{display:none} body{background:#fff} }
</style>
</head>
<body>
<header>
  <a href="index.html" class="sub" style="text-decoration:none">← Team home</a>
  <h1 id="title">Lineup Board</h1>
  <div class="sub" id="subtitle"></div>
  <div class="bar">
    <div class="seg" id="tiers" role="group" aria-label="Show">
      <button data-tier="all" aria-pressed="true">All</button>
      <button data-tier="0" aria-pressed="false">Starters</button>
      <button data-tier="1" class="s1" aria-pressed="false">1st sub</button>
      <button data-tier="2" class="s2" aria-pressed="false">2nd sub</button>
    </div>
    <select id="formation" aria-label="Formation"></select>
    <label class="chk"><input type="checkbox" id="auto" checked> Auto-refresh</label>
    <button class="btn" id="reload">Reload file</button>
    <span class="status" id="status"></span>
  </div>
</header>

<main id="drop">
  <div>
    <div class="pitch" id="pitch">
      <svg viewBox="0 0 100 150" preserveAspectRatio="none" aria-hidden="true">
        <rect x="2" y="2" width="96" height="146"/>
        <line x1="2" y1="75" x2="98" y2="75"/>
        <circle cx="50" cy="75" r="12"/>
        <rect x="27" y="2" width="46" height="20"/>
        <rect x="39" y="2" width="22" height="7"/>
        <rect x="27" y="128" width="46" height="20"/>
        <rect x="39" y="141" width="22" height="7"/>
      </svg>
    </div>
    <p class="sub" style="text-align:center;margin:6px 0 0">Attacking ↑ &nbsp;·&nbsp; Own goal ↓</p>
  </div>

  <div style="display:grid;gap:16px;align-content:start">
    <div class="panel">
      <h2>Roster by position</h2>
      <table>
        <thead><tr><th>Pos</th><th>Starter</th><th>1st sub</th><th>2nd sub</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="bench" class="sub" style="margin-top:8px"></div>
      <div id="warn" class="warn"></div>
    </div>

    <details class="panel editor">
      <summary><strong>Edit markdown here</strong> <span class="sub">(live preview)</span></summary>
      <p class="sub">Edits here preview instantly. To make them permanent, download and replace <code>lineup.md</code>, or edit the file directly. You can also drop a .md file onto the page.</p>
      <textarea id="md" spellcheck="false"></textarea>
      <div class="bar">
        <button class="btn" id="download">Download lineup.md</button>
        <label class="btn">Open .md file<input type="file" id="file" accept=".md,.markdown,.txt" hidden></label>
      </div>
    </details>
  </div>
</main>

<script>
const SOURCE = 'lineup.md';
const POLL_MS = 5000;
let model = null, tier = 'all', lastFetched = null, chosenFormation = null;

const $ = id => document.getElementById(id);

/* ---------- Markdown parsing ---------- */
function parsePlayer(s){
  s = (s || '').trim();
  if(!s || s === '-' ) return null;
  const m = s.match(/^(.*?)\s*#\s*(\d+)\s*$/);
  return m ? { name: m[1].trim(), num: m[2] } : { name: s, num: '' };
}

function parse(md){
  const out = { title:'Lineup', meta:{}, formations:{}, lineup:{}, lineupOrder:[], bench:[] };
  let section = '', cur = null, inComment = false;
  for(const raw of md.split(/\r?\n/)){
    let line = raw.trim();
    if(inComment){ if(line.includes('-->')) inComment = false; continue; }
    if(line.startsWith('<!--')){ if(!line.includes('-->')) inComment = true; continue; }
    if(!line) continue;
    let m;
    if((m = line.match(/^###\s+(.+)$/))){
      if(section === 'formations'){ cur = m[1].trim(); out.formations[cur] = {}; }
      continue;
    }
    if((m = line.match(/^##\s+(.+)$/))){
      const n = m[1].trim().toLowerCase();
      section = n.startsWith('formation') ? 'formations' : n.startsWith('lineup') ? 'lineup'
              : n.startsWith('bench') ? 'bench' : '';
      cur = null; continue;
    }
    if((m = line.match(/^#\s+(.+)$/))){ out.title = m[1].trim(); continue; }

    if(section === ''){
      if((m = line.match(/^[-*]?\s*([A-Za-z ]+):\s*(.+)$/))) out.meta[m[1].trim().toLowerCase()] = m[2].trim();
    } else if(section === 'formations' && cur){
      if((m = line.match(/^[-*]\s*([^:]+):\s*(-?[\d.]+)\s*[, ]\s*(-?[\d.]+)/))){
        out.formations[cur][m[1].trim()] = { x: parseFloat(m[2]), y: parseFloat(m[3]) };
      }
    } else if(section === 'lineup'){
      if((m = line.match(/^[-*]\s*([^:]+):\s*(.*)$/))){
        const pos = m[1].trim();
        out.lineup[pos.toLowerCase()] = m[2].split('|').map(parsePlayer);
        out.lineupOrder.push(pos);
      }
    } else if(section === 'bench'){
      if((m = line.match(/^[-*]\s*(.+)$/))){ const p = parsePlayer(m[1]); if(p) out.bench.push(p); }
    }
  }
  return out;
}

/* ---------- Rendering ---------- */
const labelOf = p => p ? (p.name + (p.num ? ` (#${p.num})` : '')) : '';
const initials = p => p ? (p.num || p.name.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase()) : '';

function render(){
  if(!model) return;
  $('title').textContent = model.title;

  // formation selector
  const names = Object.keys(model.formations);
  const wanted = chosenFormation && names.includes(chosenFormation) ? chosenFormation
               : (model.meta.formation && names.includes(model.meta.formation) ? model.meta.formation : names[0]);
  const sel = $('formation');
  sel.innerHTML = '';
  names.forEach(n => { const o = document.createElement('option'); o.value = o.textContent = n; sel.appendChild(o); });
  sel.value = wanted;
  const f = model.formations[wanted] || {};
  $('subtitle').textContent = `Formation ${wanted}` + (model.meta.opponent ? ` · vs ${model.meta.opponent}` : '');

  // pins
  const pitch = $('pitch');
  pitch.querySelectorAll('.pin').forEach(e => e.remove());
  const warn = [];
  const posKeys = Object.keys(f);
  if(posKeys.length !== 9) warn.push(`This formation has ${posKeys.length} positions (9v9 needs 9).`);

  posKeys.forEach(pos => {
    const slots = model.lineup[pos.toLowerCase()] || [];
    let shown, t = 0, fallback = false;
    if(tier === 'all' || tier === '0'){ shown = slots[0]; t = 0; }
    else { t = +tier; shown = slots[t]; if(!shown){ fallback = false; } }
    const pin = document.createElement('div');
    pin.className = 'pin' + (t===1?' t1':t===2?' t2':'') + (shown ? '' : ' empty');
    pin.style.left = f[pos].x + '%'; pin.style.top = f[pos].y + '%';

    const dot = document.createElement('div'); dot.className = 'dot';
    dot.textContent = shown ? initials(shown) : pos;
    const nm = document.createElement('div'); nm.className = 'name';
    nm.textContent = shown ? shown.name : (tier==='all' ? 'TBD' : '—');
    const ps = document.createElement('div'); ps.className = 'pos'; ps.textContent = pos;
    pin.append(dot, nm, ps);

    if(tier === 'all'){
      const extra = slots.slice(1).map((p,i)=> p ? `${i+1}: ${p.name}` : null).filter(Boolean);
      if(extra.length){ const s = document.createElement('div'); s.className='subs'; s.innerHTML = extra.map(x=>`<div></div>`).join('');
        [...s.children].forEach((d,i)=> d.textContent = extra[i]); pin.appendChild(s); }
    }
    pitch.appendChild(pin);
  });

  // table
  const tbody = $('rows'); tbody.innerHTML = '';
  const order = posKeys.slice().sort((a,b)=> f[b].y - f[a].y);   // back to front
  order.forEach(pos => {
    const slots = model.lineup[pos.toLowerCase()] || [];
    const tr = document.createElement('tr');
    [pos, labelOf(slots[0]) || '—', labelOf(slots[1]), labelOf(slots[2])].forEach((v,i)=>{
      const td = document.createElement('td'); td.textContent = v; if(i===0) td.style.fontWeight = 700; tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  // bench + warnings
  $('bench').textContent = model.bench.length ? 'Bench: ' + model.bench.map(labelOf).join(', ') : '';
  const known = new Set(posKeys.map(p=>p.toLowerCase()));
  model.lineupOrder.forEach(p => { if(!known.has(p.toLowerCase())) warn.push(`Lineup has "${p}" but formation ${wanted} has no such position.`); });
  $('warn').innerHTML = '';
  warn.forEach(w => { const d = document.createElement('div'); d.textContent = '⚠ ' + w; $('warn').appendChild(d); });
}

function applyMarkdown(md){ model = parse(md); render(); }

/* ---------- Loading / refreshing ---------- */
function setStatus(t){ $('status').textContent = t; }

async function fetchLatest(initial){
  try{
    const r = await fetch(`${SOURCE}?t=${Date.now()}`, { cache:'no-store' });
    if(!r.ok) throw new Error(r.status);
    const text = await r.text();
    if(text !== lastFetched){
      lastFetched = text;
      $('md').value = text;
      applyMarkdown(text);
      setStatus('Updated ' + new Date().toLocaleTimeString());
    } else if(initial){ setStatus('Loaded ' + new Date().toLocaleTimeString()); }
  }catch(e){
    if(initial){ setStatus('Could not load lineup.md here – open or drop a .md file, or paste into the editor.'); }
  }
}

setInterval(()=>{ if($('auto').checked && !document.hidden) fetchLatest(false); }, POLL_MS);

/* ---------- UI wiring ---------- */
$('tiers').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  tier = b.dataset.tier;
  [...$('tiers').children].forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
});
$('formation').addEventListener('change', e => { chosenFormation = e.target.value; render(); });
$('reload').addEventListener('click', () => { lastFetched = null; chosenFormation = null; fetchLatest(true); });
$('md').addEventListener('input', e => { applyMarkdown(e.target.value); setStatus('Previewing local edits'); });

function loadFile(file){
  const rd = new FileReader();
  rd.onload = () => { $('md').value = rd.result; chosenFormation = null; applyMarkdown(rd.result); setStatus('Loaded ' + file.name); };
  rd.readAsText(file);
}
$('file').addEventListener('change', e => e.target.files[0] && loadFile(e.target.files[0]));
const dz = $('drop');
['dragover','dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drop'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drop'); }));
dz.addEventListener('drop', e => e.dataTransfer.files[0] && loadFile(e.dataTransfer.files[0]));

$('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('md').value], { type:'text/markdown' }));
  a.download = 'lineup.md'; a.click(); URL.revokeObjectURL(a.href);
});

fetchLatest(true);
</script>
</body>
</html>
