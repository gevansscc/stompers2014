# Formations for 9v9 (1 goalkeeper + 8 outfield players).
# Each position is  NAME: {x: 0-100, y: 0-100}
#   x: 0 = left touchline,  100 = right touchline
#   y: 0 = the goal you attack (top of the pitch), 100 = your own goal (bottom)
# List the goalkeeper first, then defence -> attack.
# A game uses a formation by name:  formation: "3-2-3"
# Add your own by copying a block and changing the name and numbers.

