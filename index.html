<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Hub</title>
<style>
  :root{
    --bg:#f4f5f2; --card:#fff; --ink:#1c2420; --muted:#66716b; --line:#dfe3dd;
    --grass1:#2f7d44; --grass2:#2a713e; --accent:#d9822b; --blue:#0f4c81;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --card:#1d2220; --ink:#eef1ee; --muted:#9aa59f; --line:#2f3733; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .hero{
    background:repeating-linear-gradient(90deg,var(--grass1) 0 56px,var(--grass2) 56px 112px);
    color:#fff;position:relative;overflow:hidden;
  }
  .hero::after{ /* faint pitch lines */
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(rgba(255,255,255,.28),rgba(255,255,255,.28)) 50% 0/2px 100% no-repeat,
      radial-gradient(circle at 50% 50%,transparent 0 78px,rgba(255,255,255,.28) 78px 80px,transparent 80px);
  }
  .hero-inner{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:36px 20px 32px;
    display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
  .badge{width:min(42vw,170px);aspect-ratio:200/220;display:grid;place-items:center;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
  .badge svg,.badge img{width:100%;height:100%;object-fit:contain}
  h1{margin:6px 0 0;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1;letter-spacing:-.01em}
  .tag{margin:0;opacity:.92;font-size:1.05rem}
  main{max-width:900px;margin:0 auto;padding:24px 16px 56px}
  section{margin-top:28px}
  section h2{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);
    display:flex;align-items:center;gap:10px}
  section h2::after{content:"";flex:1;height:1px;background:var(--line)}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;transition:transform .12s,box-shadow .12s}
  a.card:hover,a.card:focus-visible{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.14);outline:none}
  a.card.internal{border-left-color:var(--blue)}
  .card-title{font-weight:700;display:flex;justify-content:space-between;gap:8px}
  .card-title span{color:var(--muted);font-weight:400}
  .card-desc{color:var(--muted);font-size:.92rem;margin-top:2px}
  .note{background:transparent;border:1px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--muted);font-size:.92rem}
  .foot{margin-top:36px;text-align:center;color:var(--muted);font-size:.82rem}
  .foot label{cursor:pointer;text-decoration:underline}
  .msg{margin-top:20px;padding:12px 16px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="badge" id="badge">
      <!-- Placeholder team graphic. Replace by setting "logo:" in links.md -->
      <svg viewBox="0 0 200 220" role="img" aria-label="Placeholder team badge">
        <path d="M100 8 L184 36 V108 C184 156 148 192 100 212 C52 192 16 156 16 108 V36 Z"
              fill="rgba(255,255,255,.14)" stroke="#fff" stroke-width="4" stroke-dasharray="9 7"/>
        <g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round">
          <circle cx="100" cy="92" r="36"/>
          <polygon points="100,80 111.4,88.3 107,101.7 93,101.7 88.6,88.3" fill="rgba(255,255,255,.9)"/>
          <path d="M100 80V56M111.4 88.3L133 80M107 101.7L121 120M93 101.7L79 120M88.6 88.3L67 80"/>
        </g>
        <text x="100" y="162" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" letter-spacing="2"
              font-family="system-ui,sans-serif">YOUR LOGO</text>
        <text x="100" y="180" text-anchor="middle" fill="#fff" font-size="10" opacity=".85"
              font-family="system-ui,sans-serif">replace in links.md</text>
      </svg>
    </div>
    <h1 id="title">Team Hub</h1>
    <p class="tag" id="tagline"></p>
  </div>
</header>

<main>
  <div id="content"></div>
  <div class="msg" id="msg" hidden></div>
  <div class="foot">
    <span id="status"></span>
    <label>Preview a local links.md<input type="file" id="file" accept=".md,.markdown,.txt" hidden></label>
  </div>
</main>

<script>
const SOURCE = 'links.md';
const POLL_MS = 10000;
let lastFetched = null, logoShown = null;
const $ = id => document.getElementById(id);

function parse(md){
  const out = { title:'Team Hub', meta:{}, sections:[] };
  let cur = null, inComment = false;
  for(const raw of md.split(/\r?\n/)){
    const line = raw.trim();
    if(inComment){ if(line.includes('-->')) inComment = false; continue; }
    if(line.startsWith('<!--')){ if(!line.includes('-->')) inComment = true; continue; }
    if(!line) continue;
    let m;
    if((m = line.match(/^##\s+(.+)$/))){ cur = { name:m[1].trim(), items:[] }; out.sections.push(cur); continue; }
    if((m = line.match(/^#\s+(.+)$/))){ out.title = m[1].trim(); continue; }
    if(!cur){
      if((m = line.match(/^([A-Za-z ]+):\s*(.+)$/))) out.meta[m[1].trim().toLowerCase()] = m[2].trim();
      continue;
    }
    if((m = line.match(/^[-*]\s*\[([^\]]+)\]\(([^)\s]+)\)\s*(?:[—–-]+\s*(.*))?$/))){
      cur.items.push({ title:m[1].trim(), url:m[2].trim(), desc:(m[3]||'').trim() });
    } else if((m = line.match(/^[-*]\s*(.+)$/))){
      cur.items.push({ note:m[1].trim() });
    }
  }
  return out;
}

const isExternal = u => /^(https?:)?\/\//i.test(u) || /^mailto:/i.test(u);
const safeUrl = u => /^(https?:|mailto:|tel:)/i.test(u) || !/^[a-z][a-z0-9+.-]*:/i.test(u);

function setLogo(src){
  if(src === logoShown) return;
  logoShown = src;
  if(!src) return;
  const img = new Image();
  img.alt = 'Team logo';
  img.onload = () => { if(logoShown === src){ const b = $('badge'); b.innerHTML = ''; b.appendChild(img); } };
  img.src = src;   // if it fails to load, the placeholder stays
}

function render(model){
  document.title = model.title;
  $('title').textContent = model.title;
  $('tagline').textContent = model.meta.tagline || '';
  setLogo(model.meta.logo && safeUrl(model.meta.logo) ? model.meta.logo : null);

  const root = $('content'); root.innerHTML = '';
  model.sections.forEach(sec => {
    const s = document.createElement('section');
    const h = document.createElement('h2'); h.textContent = sec.name; s.appendChild(h);
    const g = document.createElement('div'); g.className = 'grid';
    sec.items.forEach(it => {
      if(it.note !== undefined){
        const n = document.createElement('div'); n.className = 'note'; n.textContent = it.note; g.appendChild(n); return;
      }
      if(!safeUrl(it.url)) return;
      const a = document.createElement('a');
      a.className = 'card' + (isExternal(it.url) ? '' : ' internal');
      a.href = it.url;
      if(isExternal(it.url)){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      const t = document.createElement('div'); t.className = 'card-title';
      const tt = document.createElement('div'); tt.textContent = it.title;
      const ar = document.createElement('span'); ar.textContent = isExternal(it.url) ? '↗' : '→'; ar.setAttribute('aria-hidden','true');
      t.append(tt, ar); a.appendChild(t);
      if(it.desc){ const d = document.createElement('div'); d.className = 'card-desc'; d.textContent = it.desc; a.appendChild(d); }
      g.appendChild(a);
    });
    s.appendChild(g); root.appendChild(s);
  });
}

function apply(text, label){
  $('msg').hidden = true;
  render(parse(text));
  $('status').textContent = label + ' · ';
}

async function fetchLatest(initial){
  try{
    const r = await fetch(`${SOURCE}?t=${Date.now()}`, { cache:'no-store' });
    if(!r.ok) throw new Error(r.status);
    const text = await r.text();
    if(text !== lastFetched){ lastFetched = text; apply(text, 'Updated ' + new Date().toLocaleTimeString()); }
  }catch(e){
    if(initial){
      $('msg').hidden = false;
      $('msg').textContent = 'Could not load links.md. If you opened this page straight from your computer, use "Preview a local links.md" below, or host the folder (for example on GitHub Pages).';
    }
  }
}

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => apply(rd.result, 'Previewing ' + f.name);
  rd.readAsText(f);
});

setInterval(() => { if(!document.hidden && lastFetched !== null) fetchLatest(false); }, POLL_MS);
fetchLatest(true);
</script>
</body>
</html>
